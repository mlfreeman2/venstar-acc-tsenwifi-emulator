version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to match the Home Assistant version running on all deployments.
      # Bump this manually when those upgrade.
      - dependency-name: "homeassistant"
      # Home Assistant hard-pins protobuf to an exact version (==6.32.0 in HA
      # 2026.4), so ANY bump above it — major or minor — is unsatisfiable
      # against the pinned homeassistant. Ignore protobuf entirely; HA controls
      # this version. Revisit when the pinned HA version changes.
      - dependency-name: "protobuf"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
